[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fh"
version = "0.1.0"
description = "Calibrated probability that a football match has >0.5 first-half goals"
requires-python = ">=3.11"
dependencies = [
  "pandas==3.0.6",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "matplotlib==3.11.2",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "python-dotenv==1.2.3",
  "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
